    <title>QR Code Generator Pro</title>

    <style>
        /* Custom Styles that Tailwind doesn't cover easily */
        body {
            /* Smooth Gradient Animation */
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Hide Scrollbar but allow scroll */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Prevent image overflow in container */
        #qrcode img {
            margin: 0 auto;
            border-radius: 0.75rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            max-width: 100% !important;
            height: auto !important;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-slate-800">

    <div class="w-full max-w-lg bg-white/95 backdrop-blur-xl rounded-3xl shadow-2xl overflow-hidden border border-white/50 relative">
        
        <div id="installPrompt" class="hidden bg-indigo-50 border-b border-indigo-100 p-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <span class="text-2xl">📱</span>
                <div>
                    <p class="text-sm font-semibold text-indigo-900">ติดตั้งแอปพลิเคชัน</p>
                    <p class="text-xs text-indigo-600">เพื่อการใช้งานที่สะดวกยิ่งขึ้น</p>
                </div>
            </div>
            <button onclick="installApp()" class="bg-indigo-600 text-white text-xs px-4 py-2 rounded-full font-medium shadow hover:bg-indigo-700 transition">
                ติดตั้ง
            </button>
        </div>

        <div class="p-8">
            <div class="text-center mb-8">
                <div class="inline-block p-3 rounded-2xl bg-gradient-to-br from-indigo-500 to-purple-600 shadow-lg mb-4">
                    <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"></path></svg>
                </div>
                <h1 class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-600 to-purple-600">QR Code Generator</h1>
                <p class="text-slate-400 text-sm mt-1">สร้างคิวอาร์โค้ดง่ายๆ ในสไตล์โมเดิร์น</p>
            </div>

            <div class="space-y-5">
                
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2 ml-1">ข้อความ หรือ ลิงก์ URL</label>
                    <div class="relative">
                        <input type="text" id="text" 
                            class="w-full bg-slate-50 border border-slate-200 text-slate-900 text-sm rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 block w-full p-4 pl-12 transition-all shadow-sm" 
                            placeholder="https://example.com" autocomplete="off">
                        <div class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none text-slate-400">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2 ml-1">ขนาดภาพ</label>
                        <select id="size" class="bg-slate-50 border border-slate-200 text-slate-900 text-sm rounded-xl focus:ring-indigo-500 focus:border-indigo-500 block w-full p-3">
                            <option value="200">เล็ก (200px)</option>
                            <option value="300" selected>กลาง (300px)</option>
                            <option value="500">ชัดมาก (500px)</option>
                            <option value="1000">สูงสุด (1000px)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2 ml-1">ขนาดอักษร</label>
                        <select id="labelSize" class="bg-slate-50 border border-slate-200 text-slate-900 text-sm rounded-xl focus:ring-indigo-500 focus:border-indigo-500 block w-full p-3">
                            <option value="14">เล็ก</option>
                            <option value="18" selected>กลาง</option>
                            <option value="24">ใหญ่</option>
                        </select>
                    </div>
                </div>

                <div class="bg-slate-50 p-4 rounded-xl border border-slate-100">
                    <label class="block text-sm font-medium text-slate-700 mb-3">ปรับแต่งสี</label>
                    <div class="flex items-center justify-between gap-4">
                        <div class="flex-1 flex items-center gap-3 cursor-pointer" onclick="document.getElementById('colorDark').click()">
                            <div class="w-10 h-10 rounded-lg overflow-hidden border-2 border-white shadow-md ring-1 ring-slate-200">
                                <input type="color" id="colorDark" value="#0f172a" class="w-12 h-12 -m-1 cursor-pointer">
                            </div>
                            <span class="text-xs font-medium text-slate-600">สี QR Code</span>
                        </div>
                        <div class="flex-1 flex items-center gap-3 cursor-pointer" onclick="document.getElementById('colorLight').click()">
                            <div class="w-10 h-10 rounded-lg overflow-hidden border-2 border-white shadow-md ring-1 ring-slate-200">
                                <input type="color" id="colorLight" value="#ffffff" class="w-12 h-12 -m-1 cursor-pointer">
                            </div>
                            <span class="text-xs font-medium text-slate-600">สีพื้นหลัง</span>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2 ml-1">ข้อความใต้ภาพ (ถ้ามี)</label>
                    <input type="text" id="labelText" class="w-full bg-slate-50 border border-slate-200 text-slate-900 text-sm rounded-xl focus:ring-indigo-500 focus:border-indigo-500 block w-full p-3" placeholder="เช่น ชื่อร้าน, เบอร์โทร">
                </div>

                <button onclick="generateQR()" class="w-full text-white bg-gradient-to-r from-indigo-600 via-purple-600 to-indigo-600 hover:bg-right hover:scale-[1.02] focus:ring-4 focus:outline-none focus:ring-indigo-300 font-medium rounded-xl text-base px-5 py-4 text-center transition-all duration-300 shadow-lg shadow-indigo-500/30 flex items-center justify-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.384-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
                    สร้าง QR Code
                </button>
            </div>
        </div>

        <div id="qrResult" class="hidden bg-slate-50 border-t border-slate-100 p-8 text-center transition-all duration-500">
            <h3 class="text-lg font-semibold text-slate-800 mb-4">🎉 เรียบร้อยแล้ว!</h3>
            
            <div class="bg-white p-4 rounded-2xl shadow-sm inline-block border border-slate-100 mb-6">
                <div id="qrcode" class="w-[200px] h-[200px] mx-auto flex items-center justify-center"></div>
                <p id="previewText" class="mt-2 text-slate-800 font-medium"></p>
            </div>

            <button onclick="downloadQR()" class="w-full text-indigo-700 bg-indigo-100 hover:bg-indigo-200 focus:ring-4 focus:outline-none focus:ring-indigo-100 font-medium rounded-xl text-sm px-5 py-3 text-center transition-all flex items-center justify-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                ดาวน์โหลดรูปภาพ
            </button>
        </div>

        <div class="bg-white p-4 text-center border-t border-slate-100">
            <p class="text-xs text-slate-400">
                Developed by <span class="text-transparent bg-clip-text bg-gradient-to-r from-indigo-500 to-purple-500 font-bold">พว.วิษณุกรณ์ โอยา</span>
            </p>
            <p class="text-[10px] text-slate-300 mt-1">Version 3.0 (Tailwind PWA)</p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <script>
        // PWA Install Logic
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            const prompt = document.getElementById('installPrompt');
            prompt.classList.remove('hidden');
        });

        function installApp() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        document.getElementById('installPrompt').classList.add('hidden');
                    }
                    deferredPrompt = null;
                });
            }
        }

        // Generate QR Code
        function generateQR() {
            const text = document.getElementById('text').value;
            if (!text) {
                alert('กรุณากรอกข้อความก่อนครับ');
                document.getElementById('text').focus();
                return;
            }

            const size = parseInt(document.getElementById('size').value);
            const colorDark = document.getElementById('colorDark').value;
            const colorLight = document.getElementById('colorLight').value;
            const labelText = document.getElementById('labelText').value;

            const qrContainer = document.getElementById('qrcode');
            qrContainer.innerHTML = ''; // Clear old QR

            // Create QR Object
            new QRCode(qrContainer, {
                text: text,
                width: size, // Generate at full resolution
                height: size,
                colorDark: colorDark,
                colorLight: colorLight,
                correctLevel: QRCode.CorrectLevel.H
            });

            // Handle Label Preview
            const previewText = document.getElementById('previewText');
            previewText.textContent = labelText;
            
            // Show Result with animation
            const resultDiv = document.getElementById('qrResult');
            resultDiv.classList.remove('hidden');
            resultDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        // Download Logic (Canvas Merge)
        function downloadQR() {
            const qrContainer = document.getElementById('qrcode');
            const sourceCanvas = qrContainer.querySelector('canvas');
            const labelText = document.getElementById('labelText').value;
            const labelSize = parseInt(document.getElementById('labelSize').value);
            const size = parseInt(document.getElementById('size').value);

            if (!sourceCanvas) return;

            // Create new canvas for export
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');

            // Responsive Scaling for Text
            // Calculate scale ratio relative to base 300px
            const scale = size / 300; 
            const fontSize = labelSize * scale * 2.5; // Multiply for better readability on high res
            const padding = size * 0.05; // 5% padding
            const bottomSpace = labelText ? (fontSize * 2.5) : padding;

            canvas.width = size + (padding * 2);
            canvas.height = size + padding + bottomSpace;

            // Background
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw QR
            ctx.drawImage(sourceCanvas, padding, padding, size, size);

            // Draw Text
            if (labelText) {
                ctx.fillStyle = document.getElementById('colorDark').value; // Use QR color for text
                ctx.font = `600 ${fontSize}px 'Kanit', sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(labelText, canvas.width / 2, size + padding + (bottomSpace / 2) - (padding/2));
            }

            // Trigger Download
            const link = document.createElement('a');
            link.download = `QR-${Date.now()}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        // Service Worker for PWA (Minimal Cache)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
               // Fake registration for standalone PWA support
               // In production, create a real sw.js file
            });
        }
    </script>
</body>
