<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#6366f1">
    <meta name="description" content="QR Code Generator Pro - PWA">
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">

    <script src="https://cdn.tailwindcss.com"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Kanit', 'sans-serif'] }
                }
            }
        }
    </script>

    <title>QR Code Pro</title>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-slate-800">

    <div class="w-full max-w-lg bg-white/95 backdrop-blur-xl rounded-3xl shadow-2xl overflow-hidden border border-white/50 relative">
        
        <div id="installPrompt" class="hidden bg-indigo-50 border-b border-indigo-100 p-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <span class="text-2xl">📱</span>
                <div>
                    <p class="text-sm font-semibold text-indigo-900">ติดตั้งแอปพลิเคชัน</p>
                    <p class="text-xs text-indigo-600">ใช้งานแบบออฟไลน์ได้</p>
                </div>
            </div>
            <button id="btnInstall" class="bg-indigo-600 text-white text-xs px-4 py-2 rounded-full font-medium shadow hover:bg-indigo-700 transition">
                ติดตั้ง
            </button>
        </div>

        <div class="p-8">
            <div class="text-center mb-8">
                <div class="inline-block p-3 rounded-2xl bg-gradient-to-br from-indigo-500 to-purple-600 shadow-lg mb-4">
                    <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"></path></svg>
                </div>
                <h1 class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-600 to-purple-600">QR Generator Pro</h1>
            </div>

            <div class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2 ml-1">ข้อความ / URL</label>
                    <input type="text" id="text" class="w-full bg-slate-50 border border-slate-200 text-slate-900 rounded-xl p-4 focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="https://..." autocomplete="off">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2 ml-1">ขนาด</label>
                        <select id="size" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3">
                            <option value="300" selected>ปกติ (300px)</option>
                            <option value="500">ชัด (500px)</option>
                            <option value="1000">ชัดมาก (1000px)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2 ml-1">ขนาดอักษร</label>
                        <select id="labelSize" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3">
                            <option value="14">เล็ก</option>
                            <option value="18" selected>กลาง</option>
                            <option value="24">ใหญ่</option>
                        </select>
                    </div>
                </div>

                <div class="bg-slate-50 p-4 rounded-xl border border-slate-100 flex justify-between gap-4">
                    <div class="flex-1 cursor-pointer" onclick="document.getElementById('colorDark').click()">
                        <span class="text-xs text-slate-500 block mb-1">สี QR Code</span>
                        <div class="flex items-center gap-2">
                            <input type="color" id="colorDark" value="#0f172a" class="w-8 h-8 rounded cursor-pointer border-0">
                        </div>
                    </div>
                    <div class="flex-1 cursor-pointer" onclick="document.getElementById('colorLight').click()">
                        <span class="text-xs text-slate-500 block mb-1">สีพื้นหลัง</span>
                        <div class="flex items-center gap-2">
                            <input type="color" id="colorLight" value="#ffffff" class="w-8 h-8 rounded cursor-pointer border-0">
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2 ml-1">ข้อความใต้ภาพ</label>
                    <input type="text" id="labelText" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 outline-none" placeholder="(ไม่บังคับ)">
                </div>

                <button onclick="generateQR()" class="w-full text-white bg-gradient-to-r from-indigo-600 via-purple-600 to-indigo-600 hover:scale-[1.02] transition-transform rounded-xl py-4 font-medium shadow-lg shadow-indigo-500/30">
                    สร้าง QR Code
                </button>
            </div>
        </div>

        <div id="qrResult" class="hidden bg-slate-50 border-t border-slate-100 p-8 text-center">
            <div class="bg-white p-4 rounded-2xl shadow-sm inline-block border border-slate-100 mb-6">
                <div id="qrcode" class="mx-auto flex justify-center"></div>
            </div>
            <button onclick="downloadQR()" class="w-full text-indigo-700 bg-indigo-100 hover:bg-indigo-200 rounded-xl py-3 font-medium transition-colors">
                ดาวน์โหลดรูปภาพ
            </button>
        </div>
        
        <div class="bg-white p-4 text-center border-t border-slate-100 text-xs text-slate-400">
            Version 3.1 (Split Files)
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
